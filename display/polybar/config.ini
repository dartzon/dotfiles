[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
disabled = #F57900
allok = #00CC30
warning = #FF9933
alert = #F50E0E

[bar/primary]
width = 100%
height = 22pt
radius = 0
monitor= ${env:PRIMARY_MON:}

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Terminess Nerd Font Propo:style=Regular:size=12"

modules-left = i3 xwindow
modules-right = date eth wlan memory filesystem battery-combined-udev backlight bluetooth pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

scroll-up = "#i3.prev"
scroll-down = "#i3.next"
; wm-restack = i3
; override-redirect = true

[bar/secondary]
inherit = bar/primary
modules-left = i3
monitor = ${env:SECONDARY_MON:}
modules-right=systray

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

fixed-values = true

mount-0 = /

label-mounted = %{F#F0C674} %used%%{F-} / %total%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

label-warn = %{F#A54242}%used%%{F-} / %total%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

label-muted = 
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %used%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}󰈁%{F-} %local_ip%
label-disconnected = ""

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%{F-} %essid% %local_ip%
label-disconnected = ""

[module/date]
type = internal/date
interval = 1

date = %A, %b %d, %H:%M

label = %{F#F0C674} %{F-}%date%
label-foreground = ${colors.foreground}

[module/i3]
type = internal/i3

pin-workspaces = true
strip-wsnumbers = true
reverse-scroll = true
show-urgent = true
index-sort = true
wrapping-scroll = false

label-focused-foreground = ${colors.primary}
label-urgent-foreground = ${colors.alert}


[module/battery-combined-udev]
type = custom/script
env-ICON_FULL=%{F#00CC30}%{F-}
env-ICON_GT_80=%{F#00CC30}󰂂%{F-}
env-ICON_GT_60=%{F#00CC30}󰂀%{F-}
env-ICON_GT_30=%{F#00CC30}󰁽%{F-}
env-ICON_GT_10=%{F#FF9933}󰁻%{F-}
env-ICON_CRITICAL=%{F#F50E0E}󰂎%{F-}

exec = ~/.dotfiles/display/polybar/plugins/battery-combined-udev/battery-combined-udev.sh
tail = true

[module/backlight]
type = internal/backlight

; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
; Default: first usable card in /sys/class/backlight (new in version 3.7.0)
card = ${env:DISPLAY_CARD:}

use-actual-brightness = true

; Set to 0 to turn off
; New in version 3.7.0
; Default: 0 (5 if use-actual-brightness is false)
poll-interval = 0

; Enable changing the backlight with the scroll wheel
; NOTE: This may require additional configuration on some systems. Polybar will
; write to `/sys/class/backlight/${self.card}/brightness` which requires polybar
; to have write access to that file.
; DO NOT RUN POLYBAR AS ROOT. 
; The recommended way is to add the user to the
; `video` group and give that group write-privileges for the `brightness` file.
; See the ArchWiki for more information:
; https://wiki.archlinux.org/index.php/Backlight#ACPI
; Default: false
enable-scroll = true

; Interval for changing the brightness (in percentage points).
; New in version 3.7.0
; Default: 5
scroll-interval = 5

; Available tags:
;   <label> (default)
;   <ramp>
;   <bar>
format = <label>

; Available tokens:
;   %percentage% (default)
label = %{F#F0C674}󰃠%{F-} %percentage%%

; Only applies if <ramp> is used
ramp-0 = 󰃞
ramp-1 = 󰃝
ramp-2 = 󰃟
ramp-3 = 󰃠

; Only applies if <bar> is used
bar-width = 5
bar-indicator = |
bar-fill = ─
bar-empty = ─

[module/bluetooth]
type = custom/script
exec = ~/.dotfiles/display/polybar/plugins/system-bluetooth-bluetoothctl/system-bluetooth-bluetoothctl.sh
tail = true
click-left = ~/.dotfiles/display/polybar/plugins/system-bluetooth-bluetoothctl/system-bluetooth-bluetoothctl.sh --toggle &

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
